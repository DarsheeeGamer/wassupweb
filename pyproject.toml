[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wassupweb"
version = "0.1.0"
description = "Python reimplementation scaffold of the Baileys WhatsApp Web library."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8.0",
  "websockets>=12.0",
  "PyNaCl>=1.5.0",
  "protobuf>=4.25.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "grpcio-tools>=1.66.0"]
proto = ["grpcio-tools>=1.66.0"]

[tool.setuptools.packages.find]
include = ["wassupweb*"]
