[package]
name = "wassupweb"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20.0", features = ["extension-module"], optional = true }
napi = { version = "2.16.4", default-features = false, features = ["napi4"], optional = true }
napi-derive = { version = "2.16.4", optional = true }

[features]
default = []
python = ["pyo3"]
nodejs = ["napi", "napi-derive"]
